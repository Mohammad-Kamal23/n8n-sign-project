# Document stamping stack: n8n (workflow) + stamping API (FastAPI) + review UI (Streamlit) + PostgreSQL (audit log).
# Settings come from .env (copy .env.example). Ports are bound to localhost only.
# NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_core
    user: root                                  # writes to the mounted ./n8n-data and ./simulated_cloud folders
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Amman}
      - N8N_USER_FOLDER=/home/node/.n8n
      # the workflow reads and moves files in the shared folder only
      - N8N_RESTRICT_FILE_ACCESS_TO=${N8N_RESTRICT_FILE_ACCESS_TO:-/home/node/simulated_cloud}
      - N8N_BLOCK_FS_WRITE_ACCESS=false
      # the workflow uses the Execute Command node; keep n8n on localhost because of it
      - N8N_BLOCK_COMMAND_EXECUTION=false
      - N8N_COMMAND_EXEC_ENABLED=true
      - N8N_ENABLE_UNSAFE_CORE_NODES=true
      - N8N_NODES_INCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.httpRequest","n8n-nodes-base.postgres","n8n-nodes-base.gmail"]
      - NODES_EXCLUDE=[]
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./simulated_cloud:/home/node/simulated_cloud
    networks: [signing]

  fastapi:
    build: ./backend
    container_name: stamping_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: [.env]
    volumes:
      - ./backend:/app
      - ./simulated_cloud:/home/node/simulated_cloud     # same path as inside n8n, so file paths match
    networks: [signing]
    depends_on: [db]

  db:
    image: postgres:15
    container_name: signing_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-signing}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-signing_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [signing]

  ui:
    build: ./ui
    container_name: signing_ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - API_URL=http://fastapi:8000/stamp-document/
    depends_on: [fastapi]
    networks: [signing]

volumes:
  postgres_data:

networks:
  signing:
    driver: bridge
